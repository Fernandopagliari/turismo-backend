<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}
video {
    width: 100%;
    height: 100vh;
    object-fit: cover;
}
</style>
</head>
<body>
<video id="heroVideo" autoplay muted loop playsinline>
</video>

<script>
function setVideoSource(url) {
    const video = document.getElementById("heroVideo");
    video.src = url;
    video.load();
    video.play().catch(e => console.log("Autoplay bloqueado:", e));
}
</script>
</body>
</html>
